set-option -sa terminal-overrides ",xterm*:Tc"
set-option -g renumber-windows on

set -g mouse on
set -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g base-index 1
set -g prefix C-Space

setw -g pane-base-index 1

set-option -g status-right ""

set-window-option -g mode-keys vi

unbind C-b
bind C-Space send-prefix

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'roxma/vim-tmux-clipboard'
set -g @plugin 'catppuccin/tmux'

set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_text "#W"

bind -n C-S-h resize-pane -L 2
bind -n C-S-j resize-pane -D 2
bind -n C-S-k resize-pane -U 2
bind -n C-S-l resize-pane -R 2

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# makes pane splits open in the directory 
# of the current pane
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Session picker with workspace info
bind s run-shell '~/.config/tmux/label-workspaces.sh'

run '~/.tmux/plugins/tpm/tpm'
set-option -g status-style bg=default
